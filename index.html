<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barışalım mı?</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffe6e6;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      color: #b30000;
      z-index: 1;
    }

    #buttons {
      z-index: 1;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      transition: transform 0.3s ease, font-size 0.3s ease;
      cursor: pointer;
    }

    #yesBtn {
      background-color: #4CAF50;
      color: white;
      position: relative;
      z-index: 1;
      transform: scale(1);
    }

    #noBtn {
      background-color: #f44336;
      color: white;
      position: relative;
      z-index: 1;
    }

    #finalMsg {
      display: none;
      font-size: 22px;
      color: #006600;
      z-index: 2;
    }

    #yesBtn.fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      font-size: 40px;
      border-radius: 0;
      z-index: 5;
      transform: none !important;
    }
  </style>
</head>
<body>
  <h1>Çok özür dilerim... Barışalım mı? 🥺</h1>

  <div id="buttons">
    <button id="yesBtn">Evet 💖</button>
    <button id="noBtn">Hayır 🙁</button>
  </div>

  <div id="finalMsg">Barıştığın için çok teşekkür ederim... Seni çok seviyorum! 💗</div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const finalMsg = document.getElementById("finalMsg");

    const hayirMesajlari = [
      "Lütfen ama 😔",
      "Gerçekten üzgünüm...",
      "Hadi nolur 🥺",
      "Seninle konuşmadan yapamıyorum",
      "Kalbim kırık 😢",
      "Barışalım mı...",
      "Hayır deme nolur",
      "Seni çok özledim...",
      "Sadece bir 'evet' yeter 💗"
    ];

    let clickCount = 0;
    let scale = 1;

    noBtn.addEventListener("click", () => {
      if (clickCount < hayirMesajlari.length) {
        noBtn.textContent = hayirMesajlari[clickCount];
        clickCount++;
        scale += 0.3;
        yesBtn.style.transform = `scale(${scale})`;
      }

      if (scale >= 3) { // 3x büyüklükte ekranı kaplar gibi olur
        yesBtn.classList.add("fullscreen");
        noBtn.style.display = "none";
      }
    });

    yesBtn.addEventListener("click", () => {
      document.getElementById("buttons").style.display = "none";
      finalMsg.style.display = "block";
    });
  </script>
</body>
</html>
